name: DevSecOps CI/CD

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: self-hosted

    steps:
      # Checkout repo and fetch all history & tags
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generate semantic version
      - name: Generate Semantic Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"  # fixed input
          major_pattern: "BREAKING CHANGE"
          minor_pattern: "feat"
          bump_each_commit: true  # ensures version generation even if no tags exist

      # Print the generated version
      - name: Print version
        run: echo "VERSION=${{ steps.version.outputs.version }}"

      # Build Docker image
      - name: Build Docker Image
        run: |
          set -e
          VERSION=${{ steps.version.outputs.version }}
          docker build --no-cache \
            -t ghcr.io/${{ github.repository_owner }}/devsecops-app:$VERSION \
            -t ghcr.io/${{ github.repository_owner }}/devsecops-app:latest \
            -f app/Dockerfile app/

      # Scan image with Trivy
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/devsecops-app:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      # Login to GHCR
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push Docker images
      - name: Push Images
        run: |
          VERSION=${{ steps.version.outputs.version }}
          docker push ghcr.io/${{ github.repository_owner }}/devsecops-app:$VERSION
          docker push ghcr.io/${{ github.repository_owner }}/devsecops-app:latest

      # Apply Kubernetes manifests (uses existing GHCR secret)
      - name: Apply Manifests
        run: kubectl apply -f k8s/

      # Patch deployment with new version
      - name: Patch Deployment With Version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          kubectl set image deployment/devsecops-app web=ghcr.io/${{ github.repository_owner }}/devsecops-app:$VERSION

      # Wait for rollout
      - name: Wait for Rollout
        run: kubectl rollout status deployment/devsecops-app

on
